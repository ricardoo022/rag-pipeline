[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    phase0: RAG Phase 0 — staging and chunking (ingestion, schema, utilities)
    phase1: RAG Phase 1 — retrieval strategies over the materialized KB
    phase2: RAG Phase 2 — search/combination sweeps (experiments.yaml x rag_queries.yaml)
    phase3: RAG Phase 3 — end-to-end agent evaluation
